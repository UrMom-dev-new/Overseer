name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic:
    name: Typecheck, tests, build, production smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production dependency advisory gate
        run: pnpm audit --prod --audit-level=high
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: pnpm run typecheck
      - name: Integrity and source-contract tests
        run: pnpm run test:integrity
      - name: Desktop smoke harness tests
        run: pnpm run test:desktop-smoke
      - name: Install playback test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Offline viewer playback verification
        run: pnpm run test:playback
      - name: Production build
        run: pnpm run build
      - name: Production startup smoke
        run: pnpm run smoke:prod
      - name: Upload failed playback diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playback-failure-${{ github.sha }}
          path: test-results/**
          if-no-files-found: ignore
