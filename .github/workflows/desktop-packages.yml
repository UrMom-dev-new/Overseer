name: Desktop Packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - electron/**
      - electron-builder.yml
      - package.json
      - pnpm-lock.yaml
      - src/**
      - scripts/smoke-electron.mjs

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 unsigned directory package
            runner: macos-15
            command: pnpm run desktop:pack:mac
          - name: Windows x64 unsigned directory package
            runner: windows-2025
            command: pnpm run desktop:pack:win
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck
      - name: Build unsigned desktop package
        run: ${{ matrix.command }}
