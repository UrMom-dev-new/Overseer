name: Desktop Packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - electron/**
      - electron-builder.yml
      - package.json
      - pnpm-lock.yaml
      - src/**
      - scripts/smoke-electron.mjs
      - scripts/test-windows-installer.ps1
      - .github/workflows/desktop-packages.yml
      - next.config.ts
      - public/**

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 unsigned directory package
            runner: macos-15
            command: pnpm run desktop:pack:mac
          - name: Windows x64 installer and installed-app smoke
            runner: windows-2025
            command: pnpm run desktop:dist:win
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck
      - name: Integrity and source-contract tests
        run: pnpm run test:integrity
      - name: Build unsigned desktop package
        run: ${{ matrix.command }}
      - name: Install, launch, reinstall, and uninstall on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Write Windows checksums and build identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)"
          } | Set-Content release/SHA256SUMS.txt
          @{ commit = '${{ github.sha }}'; version = (Get-Content package.json | ConvertFrom-Json).version; signed = $false; scope = 'Installer lifecycle and app shell; live providers and renderer hydration not verified' } | ConvertTo-Json | Set-Content release/build-info.json
      - name: Upload Windows installer and portable application
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Overseer-Windows-x64-${{ github.sha }}
          path: |
            release/Overseer-Setup-*.exe
            release/Overseer-Portable-*.exe
            release/SHA256SUMS.txt
            release/build-info.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload desktop smoke diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Overseer-Windows-diagnostics-${{ github.sha }}
          path: desktop-smoke-results/**
          if-no-files-found: warn
