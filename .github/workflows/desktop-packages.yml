name: Desktop Packages

on:
  workflow_dispatch:
    inputs:
      live_source_mode:
        description: Live-source verification mode for packaged Windows app
        required: true
        default: release-gate
        type: choice
        options:
          - release-gate
          - report-only
  push:
    branches: [main]
    paths:
      - electron/**
      - electron-builder.yml
      - electron-builder.signed.cjs
      - package.json
      - pnpm-lock.yaml
      - src/**
      - scripts/smoke-electron.mjs
      - scripts/prepare-windows-beta-release.mjs
      - scripts/test-windows-installer.ps1
      - scripts/verify-packaged-live-sources.mjs
      - scripts/verify-live-sources.mjs
      - scripts/write-desktop-build-info.mjs
      - scripts/macos-release-policy.mjs
      - scripts/release-macos.mjs
      - scripts/verify-macos-packages.mjs
      - tests/**
      - .github/workflows/desktop-packages.yml
      - next.config.ts
      - public/**
  pull_request:
    paths:
      - electron/**
      - electron-builder.yml
      - electron-builder.signed.cjs
      - package.json
      - pnpm-lock.yaml
      - src/**
      - scripts/smoke-electron.mjs
      - scripts/prepare-windows-beta-release.mjs
      - scripts/test-windows-installer.ps1
      - scripts/verify-packaged-live-sources.mjs
      - scripts/verify-live-sources.mjs
      - scripts/write-desktop-build-info.mjs
      - scripts/macos-release-policy.mjs
      - scripts/release-macos.mjs
      - scripts/verify-macos-packages.mjs
      - tests/**
      - .github/workflows/desktop-packages.yml
      - next.config.ts
      - public/**

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 unsigned directory package
            runner: macos-15
            arch: arm64
            command: pnpm run desktop:pack:mac
          - name: macOS Intel unsigned directory package
            runner: macos-15-intel
            arch: x64
            command: pnpm run desktop:pack:mac:intel
          - name: Windows x64 installer and installed-app smoke
            runner: windows-2025
            command: pnpm run desktop:dist:win
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch || 'x64' }}
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck
      - name: Integrity and source-contract tests
        run: pnpm run test:integrity
      - name: Desktop smoke harness tests
        run: pnpm run test:desktop-smoke
      - name: Build unsigned desktop package
        run: ${{ matrix.command }}
      - name: Launch native macOS package and verify renderer
        if: runner.os == 'macOS'
        run: pnpm run smoke:desktop
        env:
          OVERSEER_DESKTOP_BINARY: release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Overseer.app/Contents/MacOS/Overseer
          OVERSEER_DESKTOP_SMOKE_REPORT_DIR: desktop-smoke-results/macos-${{ matrix.arch }}
      - name: Install, launch, reinstall, and uninstall on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Verify live sources through packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mode = 'release-gate'
          if ('${{ github.event_name }}' -eq 'pull_request') { $mode = 'report-only' }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') { $mode = '${{ inputs.live_source_mode }}' }
          $packagedApp = 'release/win-unpacked/Overseer.exe'
          if (-not (Test-Path $packagedApp)) { throw 'Expected packaged Windows app executable for live-source verification.' }
          $env:OVERSEER_DESKTOP_BINARY = (Resolve-Path $packagedApp).Path
          pnpm run verify:packaged-live-sources -- --output=desktop-smoke-results/live-sources.json --mode=$mode --verify-timeout-ms=35000
          if ($LASTEXITCODE -ne 0) { throw "Packaged live-source verification failed with exit code $LASTEXITCODE." }
          Copy-Item desktop-smoke-results/live-sources.json release/live-source-verification.json -Force
      - name: Write Windows checksums and build identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)"
          } | Set-Content release/SHA256SUMS.txt
          @{ commit = '${{ github.sha }}'; version = (Get-Content package.json | ConvertFrom-Json).version; signed = $false; event = '${{ github.event_name }}'; scope = 'Installer lifecycle, renderer hydration, map or actionable map error, layer controls, source detail panel, and packaged-app live-source report' } | ConvertTo-Json | Set-Content release/build-info.json
      - name: Upload Windows installer and portable application
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Overseer-Windows-x64-${{ github.sha }}
          path: |
            release/Overseer-Setup-*.exe
            release/Overseer-Portable-*.exe
            release/SHA256SUMS.txt
            release/build-info.json
            release/live-source-verification.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload desktop smoke diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Overseer-Windows-diagnostics-${{ github.sha }}
          path: desktop-smoke-results/**
          if-no-files-found: warn
      - name: Upload macOS smoke diagnostics
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Overseer-macOS-${{ matrix.arch }}-diagnostics-${{ github.sha }}
          path: desktop-smoke-results/**
          if-no-files-found: warn
