name: Signed macOS Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-macos-release
  cancel-in-progress: false

jobs:
  signed-macos:
    if: github.ref == 'refs/heads/main'
    name: Signed and notarized macOS ${{ matrix.arch }}
    environment: macos-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up native Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - name: Require Apple credential inputs before building
        run: node scripts/release-macos.mjs --arch=${{ matrix.arch }} --check-credentials
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deterministic release gates
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run test:integrity
          pnpm run test:desktop-smoke
      - name: Sign, notarize, staple, and validate exact DMG and ZIP
        run: pnpm run desktop:dist:mac:signed -- --arch=${{ matrix.arch }}
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload verified artifacts only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Overseer-macOS-${{ matrix.arch }}-signed-${{ github.sha }}
          path: |
            release/Overseer-*-${{ matrix.arch }}.dmg
            release/Overseer-*-${{ matrix.arch }}.zip
            release/macos-${{ matrix.arch }}-verification.json
            release/macos-${{ matrix.arch }}-live-sources.json
            release/macos-${{ matrix.arch }}-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Overseer-macOS-${{ matrix.arch }}-diagnostics-${{ github.sha }}
          path: desktop-smoke-results/**
          if-no-files-found: ignore
