name: Publish Desktop Beta

on:
  workflow_dispatch:
    inputs:
      desktop_run_id:
        description: Successful main Desktop Packages run ID
        required: true
      macos_run_id:
        description: Successful main Release Preflight run ID (both architectures)
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-desktop-beta
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify provenance and checksums, upload draft, then publish
        run: node scripts/publish-desktop-beta.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RUN_ID: ${{ inputs.desktop_run_id }}
          MACOS_RUN_ID: ${{ inputs.macos_run_id }}
