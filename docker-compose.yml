name: overseer
services:
  overseer:
    # Local-build path. No registry image is published by this repository yet;
    # add an explicit image tag only after a protected publish workflow exists.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: overseer
    # Host port is configurable via OVERSEER_PORT in .env (defaults to 3000).
    ports:
      - "${OVERSEER_PORT:-3000}:3000"
    # Optional API keys / scanner backend — copy .env.template to .env and
    # fill in what you need. Missing file is ignored (keyless feeds still work).
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - OVERSEER_DATA_DIR=/app/data
      - OVERSEER_SNAPSHOT_RETENTION_MS=${OVERSEER_SNAPSHOT_RETENTION_MS:-86400000}
    volumes:
      - overseer-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - default

  overseer-cache:
    image: nginx:alpine
    container_name: overseer-cache
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - overseer
    restart: unless-stopped
    networks:
      - default

  overseer-intel:
    build:
      context: ./intel
      dockerfile: Dockerfile
    container_name: overseer-intel
    ports:
      - "4000:4000"
    restart: unless-stopped
    networks:
      - default

volumes:
  overseer-data:
  nginx-cache:

# ── CasaOS app-store metadata (ignored by plain Docker Compose) ──
x-casaos:
  architectures:
    - amd64
    - arm64
  main: overseer
  author: Overseer contributors
  developer: Overseer contributors
  category: Network
  description:
    en_us: >-
      OVERSEER is a production-grade open-source OSINT situational-awareness
      dashboard. It aggregates real-time global intelligence across aviation,
      maritime, CCTV networks, seismic activity, wildfires, news feeds,
      weather, space weather, cyber threats (CVEs) and conflict zones into a
      single GPU-accelerated MapLibre interface. Most features work with no
      API keys.
  tagline:
    en_us: Real-time global OSINT intelligence dashboard
  title:
    en_us: OVERSEER
  icon: https://raw.githubusercontent.com/UrMom-dev-new/Overseer/main/public/casaos-icon.png
  thumbnail: https://raw.githubusercontent.com/Aiacos/overseer/master/public/og-image.png
  screenshot_link:
    - https://raw.githubusercontent.com/Aiacos/overseer/master/public/og-image.png
  scheme: http
  hostname: ""
  port_map: "3000"
  index: /
  webui_port: 3000
  envs:
    - container: SCANNER_URL
      description:
        en_us: "(Optional) RECON scanner backend URL, e.g. http://scanner:7700"
    - container: SCANNER_KEY
      description:
        en_us: "(Optional) RECON scanner shared secret (must match backend OVERSEER_KEY)."
    - container: FIRMS_API_KEY
      description:
        en_us: "(Optional) NASA FIRMS API key for active-fire data."
    - container: AIS_API_KEY
      description:
        en_us: "(Optional) aisstream.io key for maritime vessel tracking."
    - container: OPENSKY_CLIENT_ID
      description:
        en_us: "(Optional) OpenSky OAuth2 client id for higher aircraft rate limits."
    - container: OPENSKY_CLIENT_SECRET
      description:
        en_us: "(Optional) OpenSky OAuth2 client secret."
  ports:
    - container: "3000"
      description:
        en_us: "Web UI (HTTP)."
